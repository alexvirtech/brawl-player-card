<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben's Brawl Apps</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    /* === Hero Game Button === */
    .hero-link {
      display: block;
      text-align: center;
      text-decoration: none;
      color: #f0f0f0;
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.15), rgba(255, 56, 96, 0.12));
      border: 2px solid rgba(255, 107, 53, 0.5);
      border-radius: 20px;
      padding: 32px 20px;
      margin-top: 20px;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }

    .hero-link:hover {
      transform: scale(1.03);
      border-color: #ff6b35;
      box-shadow: 0 8px 32px rgba(255, 107, 53, 0.35);
    }

    .hero-link:active {
      transform: scale(0.97);
    }

    .hero-link .icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
      line-height: 1;
    }

    .hero-link .label {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(90deg, #ffd700, #ff6b35);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-link .subtitle {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 6px;
    }

    /* === Section Heading === */
    .section-title {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 28px;
      margin-bottom: 12px;
    }

    @media (max-width: 480px) {
      .hero-link {
        padding: 28px 16px;
      }

      .hero-link .icon {
        font-size: 3rem;
      }

      .hero-link .label {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 340px) {
      .hero-link .label {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="site-header">
      <span class="site-title">⭐ BEN'S BRAWL APPS</span>
      <button class="acct-btn" onclick="openAccountModal()">&#x1F464; MY ACCOUNT</button>
    </div>

    <h1>⭐ Ben's Brawl Apps</h1>

    <!-- Hero: BEN BATTLE -->
    <a href="/game/" class="hero-link">
      <div class="icon">🎮</div>
      <div class="label">BEN BATTLE</div>
      <div class="subtitle">Top-down arena game — PLAY NOW!</div>
    </a>

    <!-- Mini-Apps Link -->
    <a href="/mini-apps/" class="hero-link" style="margin-top:16px;padding:20px 16px;border-color:rgba(68,221,255,0.4);background:linear-gradient(135deg,rgba(68,221,255,0.12),rgba(68,136,255,0.08))">
      <div class="icon">🎮</div>
      <div class="label" style="background:linear-gradient(90deg,#44ddff,#4488ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:1.4rem">MINI APPS</div>
      <div class="subtitle">10 Brawl Stars tools &amp; challenges</div>
    </a>
  </div>
  <script src="/js/account.js"></script>
</body>
</html>
