<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Brawler — Ben's Brawl Apps</title>
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>
  <div class="container">
    <div class="site-header">
      <span class="site-title">⭐ BEN'S BRAWL APPS</span>
      <a href="/" class="home-link">← Home</a>
    </div>

    <div class="app-number">Mini-App #4</div>
    <h1>🔍 Find a Brawler</h1>

    <div class="tag-box">
      <input type="text" id="tag-input" placeholder="#YOURTAG">
      <button id="load-btn">LOAD</button>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Loading player...</p>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="result" class="hidden">
      <input type="text" id="search-box" class="search-input" placeholder="Type a brawler name...">
      <div id="matches"></div>
      <div id="match-count" class="text-center mt-12" style="color:#aaa"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script>
    /*
    LESSON IDEA
    Today we learn:
    1. How to filter an array (.filter)
    2. How the search / find pattern works
    3. What .includes() does for strings
    */

    let allBrawlers = []

    setupTagInput("tag-input", "load-btn", loadPlayer)

    async function loadPlayer(tag) {
      showLoading()

      try {
        const player = await fetchPlayer(tag)
        allBrawlers = player.brawlers

        document.getElementById("search-box").value = ""
        renderBrawlers(allBrawlers)
        showResult()

      } catch (err) {
        showError("😕 " + err.message)
      }
    }

    document.getElementById("search-box").addEventListener("input", (e) => {
      const query = e.target.value.trim().toUpperCase()

      if (!query) {
        renderBrawlers(allBrawlers)
        return
      }

      const filtered = allBrawlers.filter(b =>
        b.name.toUpperCase().includes(query)
      )

      renderBrawlers(filtered)
    })

    function renderBrawlers(list) {
      let html = ""

      if (list.length === 0) {
        html = `<div class="text-center mt-20" style="color:#ff6b8a; font-size:1.1rem">
          No brawlers found! Try a different name.
        </div>`
      } else {
        list.forEach(b => {
          html += `
            <div class="brawler-row">
              <span class="brawler-name">${escapeHtml(b.name)}</span>
              <span style="color:#aaa; font-size:0.85rem">PWR ${b.power}</span>
              <span class="brawler-trophies">${b.trophies.toLocaleString()} 🏆</span>
            </div>
          `
        })
      }

      document.getElementById("matches").innerHTML = html
      document.getElementById("match-count").textContent =
        `${list.length} of ${allBrawlers.length} brawlers`
    }
  </script>
</body>
</html>
