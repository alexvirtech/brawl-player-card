<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Players — Ben's Brawl Apps</title>
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>
  <div class="container">
    <div class="site-header">
      <span class="site-title">⭐ BEN'S BRAWL APPS</span>
      <a href="/" class="home-link">← Home</a>
    </div>

    <div class="app-number">Mini-App #7</div>
    <h1>🆚 Compare Players</h1>

    <div class="tag-box" style="flex-direction:column">
      <div style="display:flex; gap:10px; width:100%">
        <input type="text" id="tag-a" placeholder="Player 1 tag">
        <input type="text" id="tag-b" placeholder="Player 2 tag">
      </div>
      <button id="compare-btn" class="big-button" style="margin:12px 0 0">COMPARE!</button>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Loading players...</p>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="result" class="hidden">
      <div id="comparison"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script>
    /*
    LESSON IDEA
    Today we learn:
    1. How to fetch TWO things at once (Promise.all)
    2. Comparing objects side by side
    3. Building a VS screen
    */

    const tagA = document.getElementById("tag-a")
    const tagB = document.getElementById("tag-b")

    // Pre-fill the first input with saved tag
    const saved = getLastTag()
    if (saved) tagA.value = saved

    document.getElementById("compare-btn").addEventListener("click", async () => {
      const t1 = cleanTag(tagA.value)
      const t2 = cleanTag(tagB.value)

      if (!t1 || !t2) {
        showError("Enter two player tags!")
        return
      }

      tagA.value = t1
      tagB.value = t2
      saveTag(t1)

      showLoading()

      try {
        // Fetch both players at the same time!
        const [p1, p2] = await Promise.all([
          fetchPlayer(t1),
          fetchPlayer(t2),
        ])

        function compareRow(label, val1, val2) {
          const win1 = val1 > val2
          const win2 = val2 > val1
          const c1 = win1 ? "#ffd700" : "#aaa"
          const c2 = win2 ? "#ffd700" : "#aaa"
          return `
            <div class="stat-row">
              <span style="color:${c1}; font-weight:700; min-width:60px">${typeof val1 === "number" ? val1.toLocaleString() : val1}</span>
              <span class="stat-label" style="text-align:center; flex:1">${label}</span>
              <span style="color:${c2}; font-weight:700; min-width:60px; text-align:right">${typeof val2 === "number" ? val2.toLocaleString() : val2}</span>
            </div>
          `
        }

        let wins1 = 0
        let wins2 = 0

        if (p1.trophies > p2.trophies) wins1++
        else if (p2.trophies > p1.trophies) wins2++

        if (p1.highestTrophies > p2.highestTrophies) wins1++
        else if (p2.highestTrophies > p1.highestTrophies) wins2++

        if (p1.expLevel > p2.expLevel) wins1++
        else if (p2.expLevel > p1.expLevel) wins2++

        if (p1.brawlers.length > p2.brawlers.length) wins1++
        else if (p2.brawlers.length > p1.brawlers.length) wins2++

        let winnerText = "It's a tie! 🤝"
        if (wins1 > wins2) winnerText = `${escapeHtml(p1.name)} wins! 🎉`
        if (wins2 > wins1) winnerText = `${escapeHtml(p2.name)} wins! 🎉`

        document.getElementById("comparison").innerHTML = `
          <div class="card card-gold">
            <div class="vs-container">
              <div class="vs-player">
                <div class="name" style="color:#48dbfb">${escapeHtml(p1.name)}</div>
              </div>
              <div class="vs-text">VS</div>
              <div class="vs-player">
                <div class="name" style="color:#ff6b35">${escapeHtml(p2.name)}</div>
              </div>
            </div>

            ${compareRow("🏆 Trophies", p1.trophies, p2.trophies)}
            ${compareRow("🔥 Highest", p1.highestTrophies, p2.highestTrophies)}
            ${compareRow("⭐ Level", p1.expLevel, p2.expLevel)}
            ${compareRow("👊 Brawlers", p1.brawlers.length, p2.brawlers.length)}

            <div class="winner-text mt-20">${winnerText}</div>
            <div class="text-center mt-12" style="color:#aaa">
              Score: ${wins1} – ${wins2}
            </div>
          </div>
        `

        showResult()

      } catch (err) {
        showError("😕 " + err.message)
      }
    })

    // Enter key on either input triggers compare
    tagA.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("compare-btn").click()
    })
    tagB.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("compare-btn").click()
    })
  </script>
</body>
</html>
