<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEN BATTLE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-wrapper">
    <a href="/" id="home-link">← Home</a>
    <button id="sound-btn">Sound ON</button>

    <canvas id="game-canvas"></canvas>

    <div id="score-hud" class="hidden">YOU 0 : 0 ENEMIES</div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
      <h1>BEN BATTLE</h1>
      <div class="subtitle">Ready to battle?</div>
      <button id="play-btn" class="play-btn">PLAY</button>
      <div class="controls-info">
        <strong>MOVE:</strong> WASD / Arrows<br>
        <strong>AIM:</strong> Mouse<br>
        <strong>SHOOT:</strong> Click / Space<br>
        <strong>DEBUG:</strong> F3
      </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="overlay hidden">
      <div id="end-title"></div>
      <button id="replay-btn" class="play-btn">PLAY AGAIN</button>
    </div>

    <!-- Debug Panel -->
    <div id="debug-panel" class="hidden"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/bullet.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
