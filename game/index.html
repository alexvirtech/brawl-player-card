<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BEN BATTLE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-wrapper">
    <a href="/" id="home-link">← Home</a>
    <button id="sound-btn">Sound ON</button>
    <button id="acct-link" class="acct-btn" onclick="openAccountModal()" style="position:absolute;top:8px;right:120px;z-index:50">MY ACCOUNT</button>

    <canvas id="game-canvas"></canvas>

    <div id="score-hud" class="hidden">YOU 0 : 0 ENEMIES</div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
      <h1>BEN BATTLE</h1>
      <div class="subtitle">Ready to battle?</div>
      <div class="start-buttons">
        <button id="play-btn" class="play-btn">PLAY SOLO</button>
        <button id="mp-btn" class="play-btn mp-btn" onclick="window.location.href='/game/lobby.html'">PLAY WITH FRIENDS</button>
      </div>
      <div class="controls-info" id="controls-desktop">
        <strong>MOVE:</strong> WASD / Arrows<br>
        <strong>AIM:</strong> Mouse<br>
        <strong>SHOOT:</strong> Click / Space<br>
        <strong>DEBUG:</strong> F3
      </div>
      <div class="controls-info" id="controls-touch" style="display:none">
        <strong>MOVE:</strong> Drag left side<br>
        <strong>SHOOT:</strong> Tap right side
      </div>
      <script>
        if ('ontouchstart' in window) {
          document.getElementById('controls-desktop').style.display = 'none'
          document.getElementById('controls-touch').style.display = 'block'
        }
      </script>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="overlay hidden">
      <div id="end-title"></div>
      <button id="replay-btn" class="play-btn">PLAY AGAIN</button>
    </div>

    <!-- Debug Panel -->
    <div id="debug-panel" class="hidden"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/bullet.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
